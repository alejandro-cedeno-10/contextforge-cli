name: Publish packages (npmjs.com)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js (npmjs.com registry)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@alejandro-cedeno-10"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check (project references)
        run: pnpm typecheck

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Publish @alejandro-cedeno-10/contextforge-core
        run: pnpm publish --filter @alejandro-cedeno-10/contextforge-core --no-git-checks --access public --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @alejandro-cedeno-10/contextforge-mcp
        run: pnpm publish --filter @alejandro-cedeno-10/contextforge-mcp --no-git-checks --access public --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @alejandro-cedeno-10/contextforge-cli
        run: pnpm publish --filter @alejandro-cedeno-10/contextforge-cli --no-git-checks --access public --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
